<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="64" viewBox="0 0 1200 64" role="img"
  aria-label="Training run in progress. Progress bar at roughly sixty percent. ETA: infinity, still learning.">
  <defs>
    <linearGradient id="fill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="barclip"><rect x="356" y="28" width="310" height="8" rx="4"/></clipPath>
  </defs>
  <rect x="0.5" y="0.5" width="1199" height="63" rx="18" fill="#ffffff" stroke="#d0d7de"/>
  <circle cx="48" cy="32" r="4.5" fill="#059669">
    <animate attributeName="opacity" values="1;0.25;1" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <text x="62" y="36" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.5" fill="#1f2328">training run in progress</text>
  <text x="342" y="36" text-anchor="end" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.5" fill="#636c76">epoch 1/∞</text>
  <rect x="356" y="28" width="500" height="8" rx="4" fill="#e3e8ee"/>
  <rect x="356" y="28" width="0" height="8" rx="4" fill="url(#fill)">
    <animate attributeName="width" from="0" to="310" begin="0.3s" dur="2.2s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.2 0.8 0.3 1"/>
  </rect>
  <rect x="276" y="28" width="80" height="8" fill="url(#shine)" clip-path="url(#barclip)">
    <animate attributeName="x" from="276" to="666" begin="2.6s" dur="2.4s" repeatCount="indefinite"/>
  </rect>
  <text x="870" y="36" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.5" fill="#636c76">62%</text>
  <text x="1160" y="36" text-anchor="end" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.5" fill="#636c76">ETA: ∞ · still learning<tspan fill="#0891b2"><animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>▍</tspan></text>
</svg>
