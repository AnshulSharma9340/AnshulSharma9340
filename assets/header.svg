<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-label="Anshul Sharma – AI/ML Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070d"/>
      <stop offset="0.6" stop-color="#0b1222"/>
      <stop offset="1" stop-color="#101a33"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.85" cy="0.15" r="0.55">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.1" cy="1" r="0.6">
      <stop offset="0" stop-color="#06b6d4" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="name" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1200" y2="0" spreadMethod="repeat">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.35" stop-color="#a78bfa"/>
      <stop offset="0.7" stop-color="#34d399"/>
      <stop offset="1" stop-color="#22d3ee"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1200 0; 0 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1e293b" stroke-width="0.6"/>
    </pattern>
    <filter id="soft"><feGaussianBlur stdDeviation="2.2"/></filter>
  </defs>

  <rect width="1200" height="330" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="330" rx="22" fill="url(#grid)" opacity="0.55"/>
  <rect width="1200" height="330" rx="22" fill="url(#glowA)"/>
  <rect width="1200" height="330" rx="22" fill="url(#glowB)"/>

  <!-- neural network: 3 layers with signals flowing through -->
  <g transform="translate(820 40)" opacity="0.9">
    <g stroke="#334155" stroke-width="1">
      <path id="e1" d="M20 40 L150 20"/><path id="e2" d="M20 40 L150 120"/><path id="e3" d="M20 125 L150 20"/>
      <path id="e4" d="M20 125 L150 120"/><path id="e5" d="M20 125 L150 220"/><path id="e6" d="M20 210 L150 120"/>
      <path id="e7" d="M20 210 L150 220"/><path id="e8" d="M150 20 L290 70"/><path id="e9" d="M150 120 L290 70"/>
      <path id="e10" d="M150 120 L290 175"/><path id="e11" d="M150 220 L290 175"/><path id="e12" d="M150 20 L290 175"/>
    </g>
    <g fill="#22d3ee" filter="url(#soft)">
      <circle r="4"><animateMotion dur="2.4s" repeatCount="indefinite"><mpath href="#e1"/></animateMotion></circle>
      <circle r="4"><animateMotion dur="3.1s" begin="0.6s" repeatCount="indefinite"><mpath href="#e4"/></animateMotion></circle>
      <circle r="4"><animateMotion dur="2.7s" begin="1.1s" repeatCount="indefinite"><mpath href="#e6"/></animateMotion></circle>
      <circle r="4" fill="#a78bfa"><animateMotion dur="2.2s" begin="0.3s" repeatCount="indefinite"><mpath href="#e9"/></animateMotion></circle>
      <circle r="4" fill="#a78bfa"><animateMotion dur="2.9s" begin="1.4s" repeatCount="indefinite"><mpath href="#e11"/></animateMotion></circle>
      <circle r="4" fill="#34d399"><animateMotion dur="2.5s" begin="0.9s" repeatCount="indefinite"><mpath href="#e12"/></animateMotion></circle>
      <circle r="4" fill="#34d399"><animateMotion dur="3.3s" begin="1.8s" repeatCount="indefinite"><mpath href="#e2"/></animateMotion></circle>
    </g>
    <g stroke-width="2">
      <g fill="#0b1222" stroke="#22d3ee">
        <circle cx="20" cy="40" r="9"/><circle cx="20" cy="125" r="9"/><circle cx="20" cy="210" r="9"/>
      </g>
      <g fill="#0b1222" stroke="#a78bfa">
        <circle cx="150" cy="20" r="11"><animate attributeName="r" values="11;13;11" dur="2s" repeatCount="indefinite"/></circle>
        <circle cx="150" cy="120" r="11"><animate attributeName="r" values="11;13;11" dur="2s" begin="0.7s" repeatCount="indefinite"/></circle>
        <circle cx="150" cy="220" r="11"><animate attributeName="r" values="11;13;11" dur="2s" begin="1.3s" repeatCount="indefinite"/></circle>
      </g>
      <g fill="#0b1222" stroke="#34d399">
        <circle cx="290" cy="70" r="13"/><circle cx="290" cy="175" r="13"/>
      </g>
    </g>
  </g>

  <!-- prompt line -->
  <text x="64" y="78" font-family="JetBrains Mono, Cascadia Code, Consolas, monospace" font-size="17" fill="#64748b">
    <tspan fill="#34d399">anshul@ai</tspan><tspan fill="#64748b">:</tspan><tspan fill="#22d3ee">~/agents</tspan><tspan fill="#64748b">$ </tspan><tspan fill="#e2e8f0">whoami</tspan>
    <tspan fill="#e2e8f0">▍<animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/></tspan>
  </text>

  <text x="60" y="160" font-family="Segoe UI, SF Pro Display, Inter, Helvetica, Arial, sans-serif" font-size="74" font-weight="800" letter-spacing="-1.5" fill="url(#name)">ANSHUL SHARMA</text>
  <text x="64" y="204" font-family="Segoe UI, SF Pro Display, Inter, Helvetica, Arial, sans-serif" font-size="25" font-weight="600" fill="#e2e8f0">AI/ML Engineer  ·  Agent Harness Engineering  ·  Construction AI</text>

  <g font-family="JetBrains Mono, Cascadia Code, Consolas, monospace" font-size="14" font-weight="600">
    <rect x="64" y="236" width="186" height="34" rx="17" fill="#0f172a" stroke="#22d3ee" stroke-opacity="0.6"/>
    <text x="157" y="258" text-anchor="middle" fill="#67e8f9">multi-agent systems</text>
    <rect x="262" y="236" width="160" height="34" rx="17" fill="#0f172a" stroke="#a78bfa" stroke-opacity="0.6"/>
    <text x="342" y="258" text-anchor="middle" fill="#c4b5fd">LLM fine-tuning</text>
    <rect x="434" y="236" width="184" height="34" rx="17" fill="#0f172a" stroke="#34d399" stroke-opacity="0.6"/>
    <text x="526" y="258" text-anchor="middle" fill="#6ee7b7">real-time voice AI</text>
    <rect x="630" y="236" width="196" height="34" rx="17" fill="#0f172a" stroke="#f472b6" stroke-opacity="0.6"/>
    <text x="728" y="258" text-anchor="middle" fill="#f9a8d4">@ Rapid Innovation</text>
  </g>
</svg>
